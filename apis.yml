aid: education-holdings-1-the-princeton-review
name: Education Holdings 1 (The Princeton Review)
description: >-
  Education Holdings 1 operates The Princeton Review, an educational services company
  offering standardized test preparation, one-on-one and on-demand tutoring, and college,
  graduate, medical, and law school admissions counseling. The Princeton Review prepares
  students for the SAT, ACT, PSAT, AP, MCAT, DAT, OAT, LSAT, GRE, GMAT, SSAT, ISEE, and
  SHSAT through live, self-paced, and honors courses, publishes college and graduate school
  rankings and guidebooks, and provides free practice tests, events, and study resources.
  The company was surfaced as a portfolio company of Bain Capital Ventures and profiled in
  the API Evangelist network. The Princeton Review operates a consumer web presence rather
  than a public developer program; it publishes an llms.txt AI-discovery file but does not
  expose a documented public API, developer portal, or OpenAPI at this time.
